apiVersion: v1
kind: ConfigMap
metadata:
  name: tenantscope-config
  namespace: tenantscope
data:
  DB_URL: jdbc:postgresql://postgres:5432/tenantscope
  TENANTSCOPE_SEED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: tenantscope-app
  namespace: tenantscope
type: Opaque
stringData:
  DB_USER: tenantscope
  DB_PASSWORD: change-me-in-real-clusters
  TENANTSCOPE_API_KEYS: dev-key-change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantscope
  namespace: tenantscope
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenantscope
  template:
    metadata:
      labels:
        app: tenantscope
    spec:
      containers:
        - name: tenantscope
          image: tenantscope:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tenantscope-config
            - secretRef:
                name: tenantscope-app
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tenantscope
  namespace: tenantscope
spec:
  selector:
    app: tenantscope
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tenantscope
  namespace: tenantscope
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tenantscope
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tenantscope
  namespace: tenantscope
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tenantscope
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
