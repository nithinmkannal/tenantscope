apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenantscope
  namespace: tenantscope
spec:
  rules:
    - host: tenantscope.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenantscope
                port:
                  number: 80
