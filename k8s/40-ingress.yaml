apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: triagelens
  namespace: triagelens
spec:
  rules:
    - host: triagelens.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: triagelens
                port:
                  number: 80
