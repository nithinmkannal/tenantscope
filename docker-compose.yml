services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triagelens
      POSTGRES_USER: triagelens
      POSTGRES_PASSWORD: triagelens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagelens"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/triagelens
      DB_USER: triagelens
      DB_PASSWORD: triagelens
      TRIAGELENS_API_KEYS: dev-key-change-me
      TRIAGELENS_SEED: "true"
    ports:
      - "8085:8080"

volumes:
  pgdata:
