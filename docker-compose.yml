services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenantscope
      POSTGRES_USER: tenantscope
      POSTGRES_PASSWORD: tenantscope
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantscope"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tenantscope
      DB_USER: tenantscope
      DB_PASSWORD: tenantscope
      TENANTSCOPE_API_KEYS: dev-key-change-me
      TENANTSCOPE_SEED: "true"
    ports:
      - "8085:8080"

volumes:
  pgdata:
