spring:
  application:
    name: tenantscope
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tenantscope}
    username: ${DB_USER:tenantscope}
    password: ${DB_PASSWORD:tenantscope}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

tenantscope:
  security:
    # Comma-separated list of accepted API keys (X-API-Key header). Override in real deployments.
    api-keys: ${TENANTSCOPE_API_KEYS:dev-key-change-me}
  seed:
    enabled: ${TENANTSCOPE_SEED:false}
